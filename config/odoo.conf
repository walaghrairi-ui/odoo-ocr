[options]
; Modules personnalises (les modules standard d'Odoo sont ajoutes automatiquement)
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; Mot de passe maitre : protege la creation / suppression des bases.
; A CHANGER avant toute mise en ligne.
admin_passwd = admin_change_me

; La connexion a PostgreSQL (hote, utilisateur, mot de passe) est
; fournie par docker-compose.yml via les variables HOST / USER / PASSWORD.

; L'OCR + plusieurs appels Groq peuvent prendre du temps sur une grosse
; facture : on laisse de la marge (utile seulement si workers > 0).
limit_time_cpu = 300
limit_time_real = 600

log_level = info
